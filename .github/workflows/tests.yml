name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: fielddesk
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: fielddesk_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U fielddesk -d fielddesk_test" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://fielddesk:ci-only-test-password@localhost:5432/fielddesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
